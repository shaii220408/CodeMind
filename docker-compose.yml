services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: coderag
      POSTGRES_USER: coderag
      POSTGRES_PASSWORD: coderag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderag -d coderag"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery worker --loglevel=INFO
    env_file: .env
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
