name: CodeRAG CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: coderag
          POSTGRES_USER: coderag
          POSTGRES_PASSWORD: coderag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coderag -d coderag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://coderag:coderag@localhost:5432/coderag
      REDIS_URL: redis://localhost:6379/0
      UPLOAD_DIR: /tmp/coderag-uploads
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run unit, API, PostgreSQL, retrieval, and E2E tests
        working-directory: backend
        run: pytest -q
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
